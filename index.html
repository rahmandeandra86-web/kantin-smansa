<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>yourfood🤤</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0a7d4f;--gd:#065c3a;--y:#ffc83d;--bg:#f5f7f4;--t:#1b2420;--m:#6b7870;--w:#fff;--r:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#121a16;--t:#e8efea;--m:#9aa8a0;--w:#1c2621}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:86px}
main{max-width:720px;margin:auto;padding:0 14px}header{background:var(--g);color:#fff;padding:18px 14px 56px;border-radius:0 0 26px 26px}
header div{max-width:720px;margin:auto}h1{margin:0;font-size:24px;font-weight:800}header p{margin:2px 0 0;opacity:.85}
.search{max-width:720px;margin:-26px auto 0;padding:0 14px}.search input{width:100%;padding:14px 16px;border:0;border-radius:14px;font:inherit;background:var(--w);color:var(--t);box-shadow:0 4px 14px #0002}
.po{margin:14px 0;padding:12px 14px;border-radius:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}.po.open{background:#d9f5e5;color:#065c3a}.po.soon{background:#fff0c2;color:#7a5200}.po.closed{background:#fbdcdc;color:#8b1f1f}
.banner{background:linear-gradient(120deg,var(--y),#ffdf85);color:#3a2d00;border-radius:16px;padding:16px;margin-bottom:12px}.banner b{font-size:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.chip{border:0;padding:8px 16px;border-radius:99px;background:var(--w);color:var(--t);font:inherit;font-weight:600;white-space:nowrap;cursor:pointer}.chip.on{background:var(--g);color:#fff}
h2{font-size:17px;margin:16px 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--w);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}.card:active{transform:scale(.98)}
.pic{height:96px;display:flex;align-items:center;justify-content:center;font-size:46px;background:#e6efe9}.pic img{width:100%;height:100%;object-fit:cover}
.info{padding:10px;flex:1;display:flex;flex-direction:column;gap:3px}.info small{color:var(--m)}.price{font-weight:800;color:var(--g)}
button.add{margin-top:auto;border:0;background:var(--g);color:#fff;padding:9px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;background:var(--w);padding:10px;border-radius:14px;margin-bottom:8px}.row .grow{flex:1}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);color:var(--t);font-size:18px;cursor:pointer}
.box{background:var(--w);padding:14px;border-radius:16px;margin:10px 0}.box input,.box select,.box textarea{width:100%;padding:11px;margin:4px 0 10px;border:1px solid #8884;border-radius:10px;font:inherit;background:var(--bg);color:var(--t)}
.sum div{display:flex;justify-content:space-between;padding:3px 0}.tot{font-weight:800;font-size:17px;border-top:1px dashed #8886;margin-top:6px;padding-top:8px}
.err{color:var(--r);font-size:13px}.ok{color:var(--g);font-size:13px}.big{width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.pay label{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid #8882}.pay label > div{display:flex;gap:8px;align-items:center}.pay input{width:auto;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--w);display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 -2px 12px #0002;z-index:99}
nav button{background:none;border:0;font:inherit;color:var(--m);display:flex;flex-direction:column;align-items:center;font-size:12px;cursor:pointer;position:relative}nav button.on{color:var(--g);font-weight:700}nav span{font-size:22px}nav i{position:absolute;top:-4px;right:-2px;background:var(--r);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-style:normal}
.empty{text-align:center;color:var(--m);padding:40px 10px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;animation:f .25s}@keyframes f{from{opacity:0;transform:translate(-50%,10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div><h1>yourfood🤤</h1><p>Pesan dulu, ambil nanti.</p></div></header>
<div class="search"><input id="s" placeholder="Cari makanan atau minuman…" oninput="q=this.value;go('home');"></div>
<main id="app"></main>

<nav>
  <button id="n-home" onclick="go('home')"><span>🏠</span>Beranda</button>
  <button id="n-cart" onclick="go('cart')"><span>🛒</span>Keranjang<i id="cc"></i></button>
  <button id="n-orders" onclick="go('orders')"><span>🧾</span>Pesanan</button>
</nav>

<script>
const $=s=>document.querySelector(s),rp=n=>'Rp'+Number(n).toLocaleString('id-ID'),esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const KELAS=Array.from({length:12},(_,i)=>'XII.F'+(i+1));
const PR=[
  {t:'Promo SMANSAGEMBIRA',h:'Diskon 10%!',d:'Belanja minimal Rp50.000 s.d. Rp99.999.',i:'🎉',bg:'#0a7d4f,#13a06a'},
  {t:'Promo BESMARTWUS',h:'Diskon 15%!',d:'Belanja minimal Rp100.000 ke atas.',i:'⚡',bg:'#3b5bdb,#5c7cfa'}
];
let bi=0;const bnr=()=>{const p=PR[bi];return `<div class="banner" id="bn" style="background:linear-gradient(120deg,${p.bg});color:#fff"><small>${p.t}</small><br><b>${p.i} ${p.h}</b><br>${p.d}</div>`};

const DEFAULT_PRODUCTS=[
  {id:1,category_id:1,name:'Nasi Goreng Telur',price:12000,stock:15,active:true,rec:true,description:'Nasi goreng gurih dengan telur',cat:'Makanan Berat',image:'https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=300&q=80'},
  {id:3,category_id:1,name:'Nasi Telur Kecap',price:10000,stock:20,active:true,rec:false,description:'Nasi putih dengan telur ceplok kecap',cat:'Makanan Berat',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQElxRWbYSuqBDTgE0ZZJK7MA1JXBu3BmkRTilTJF4tjg&s=10'},
  {id:4,category_id:1,name:'Nasi Ayam Suwir',price:13000,stock:15,active:true,rec:false,description:'Nasi dengan suwiran ayam pedas',cat:'Makanan Berat',image:'https://img-global.cpcdn.com/recipes/57406ed257653d33/1200x630cq80/photo.jpg'},
  {id:5,category_id:1,name:'Nasi Uduk',price:15000,stock:25,active:true,rec:false,description:'Nasi uduk harum, lengkap dengan ayam goreng',cat:'Makanan Berat',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkCE2Po-SIoc_OteQwGdhnbcODE9CZYrbouok3cxg3CR0y3zSh87EAd2M&s=10'},
  {id:6,category_id:2,name:'Bakwan',price:2000,stock:30,active:true,rec:false,description:'Bakwan sayur renyah hangat',cat:'Makanan Ringan',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrSQ7VdXrgeKpuXc7nBUs0X7q4HddLDfHjxcUW-IorOw&s=10'},
  {id:7,category_id:2,name:'Risol Mayo',price:3500,stock:25,active:true,rec:false,description:'Risol mayo enak pokoknya',cat:'Makanan Ringan',image:'https://asset.kompas.com/crops/gcJkZjTn06T6O2PBGC6uff_v8cg=/0x283:800x817/1200x800/data/photo/2022/07/29/62e35a47c7535.jpg'},
  {id:8,category_id:2,name:'Gehu Pedas',price:2000,stock:30,active:true,rec:false,description:'Tahu isi toge pedas mantap',cat:'Makanan Ringan',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtXdmvSCL5Obo9wB1-C-J83m9h2rjspgW7YxE84-M7ffHv_MfJN0AG2xyX&s=10'},
  {id:9,category_id:2,name:'Cireng bumbu rujak',price:5000,stock:20,active:true,rec:false,description:'Cireng kenyal dengan bumbu rujak',cat:'Makanan Ringan',image:'https://dcostseafood.id/wp-content/uploads/2024/10/Cireng-bumbu-rujak.jpg'},
  {id:10,category_id:2,name:'Sosis Bakar Badag',price:5000,stock:15,active:true,rec:false,description:'Sosis bakar ngeunah',cat:'Makanan Ringan',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSc43vcj3SLBI-Piy3d1PIuqaPiaASZuiD0Mxxj9Eqhaq7eNq34gIvIqF_w&s=10'},
  {id:11,category_id:2,name:'Kentang Goreng',price:7000,stock:15,active:true,rec:false,description:'French fries gurih renyah',cat:'Makanan Ringan',image:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=300&q=80'},
  {id:12,category_id:3,name:'Mie Ayam Komplit',price:12000,stock:15,active:true,rec:true,description:'Mie ayam lengkap enak mantap nagih🤤',cat:'Mie dan Instan',image:'https://nibble-images.b-cdn.net/nibble/original_images/asal_usul_mie_ayam_01_0ace759bee.jpg'},
  {id:13,category_id:3,name:'Seblak Ceker Lada',price:10000,stock:15,active:true,rec:false,description:'Seblak kuah pedas topping ceker',cat:'Mie dan Instan',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvDNc17Lq7r-OMrcPNF0pklFI50-RvTO8JGLy2OVwsaCGEWkneeXVAeT8&s=10'},
  {id:14,category_id:3,name:'Bakso Bakar',price:10000,stock:20,active:true,rec:false,description:'satu tusuk 5 biji',cat:'Mie dan Instan',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSaKDh4AlXHuNko2WC8Z-h_Tes6vCJpTos_B8ikN4Mve0XxuG22MohyaZA&s=10'},
  {id:15,category_id:3,name:'Mie Tek-Tek',price:12000,stock:15,active:true,rec:false,description:'Mie goreng',cat:'Mie dan Instan',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_jcF1wx6_i1xkUAWhAmdUVQZYzybx1xWGIFGsN0B5huzLM2gENX8YwDg&s=10'},
  {id:2,category_id:1,name:'Nasi Ayam Katsu',price:12000,stock: 12,active:true,rec:true,description:'Nasi dengan ayam katsu renyah',cat:'Makanan Berat',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTebeFIOM6-0NiuD4kRPxoEEXqvoOe34Q6XYJCSOvqdOTgAr62FtNRcYPE&s=10'},
  {id:16,category_id:4,name:'Es Teh Manis',price:3000,stock:40,active:true,rec:true,description:'Teh manis dingin menyegarkan',cat:'Minuman',image:'https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=300&q=80'},
  {id:17,category_id:4,name:'Es Cokelat',price:5000,stock:25,active:true,rec:false,description:'Es cokelat manis pekat',cat:'Minuman',image:'https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=300&q=80'},
  {id:18,category_id:4,name:'Es Lemon Tea',price:5000,stock:20,active:true,rec:false,description:'Es Teh lemon segar asam manis asoyy',cat:'Minuman',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSi2uYd4gX5FHLJpx5FmNuYi7O0QOBWYpZ79FNcRrQrWhEf9g2p4jTUpro&s=10'},
  {id:19,category_id:4,name:'Milk Tea',price:10000,stock:20,active:true,rec:false,description:'Teh susu creamy nikmat seger',cat:'Minuman',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfB6FShkgZAE0b00wRzXFm1jhe3y4JRd2fWh36D8zauoMAgHCt9CnK_g&s=10'},
  {id:20,category_id:4,name:'Es Jeruk',price:5000,stock:25,active:true,rec:false,description:'Es jeruk peras asli segar',cat:'Minuman',image:'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=300&q=80'},
  {id:21,category_id:4,name:'Air Mineral',price:5000,stock:50,active:true,rec:false,description:'Air mineral botol 600ml, minuman paling sehat di dunia',cat:'Minuman',image:'https://images.alodokter.com/dk0z4ums3/image/upload/v1778571982/attached_image/air-mineral-yang-baik-untuk-kesehatan-1-alodokter.jpg'},
  {id:22,category_id:5,name:'Pisang Cokelat',price:2000,stock:20,active:true,rec:false,description:'Piscok lumer renyah',cat:'Roti & Manis',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQN57GDwAnp4buz3dsYypkuO8Irx43e7ACvqTCK2hN78w&s=10'},
  {id:23,category_id:5,name:'Roti Bakar',price:7000,stock:15,active:true,rec:false,description:'Roti bakar selai cokelat keju',cat:'Roti & Manis',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTriVVi3T9TPipGCux9IoZ7eB6JLuQgkLPIpvUdpQElpRwcgFEWGXFhCN6G&s=10'},
  {id:24,category_id:5,name:'Donat',price:3000,stock:20,active:true,rec:false,description:'Donat lembut tabur meses',cat:'Roti & Manis',image:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSfNrOJk-6GK0QgFvTJvXFEBBiHsZCmwtk5zvbsDMU3KeWJaDQhAik5U7S&s=10'},
  {id:25,category_id:5,name:'Puding cokelat pa hambali',price:5000,stock:15,active:true,rec:false,description:'Puding cokelat lembut',cat:'Roti & Manis',image:'https://s3.ap-southeast-3.amazonaws.com/assets.primaku.com/article_image/1668521290983-59fbf5ba.jpg?tr=w-200'}
];

let M={
  categories:[
    {id:1,name:'Makanan Berat'},
    {id:2,name:'Makanan Ringan'},
    {id:3,name:'Mie & Instan'},
    {id:4,name:'Minuman'},
    {id:5,name:'Roti & Manis'}
  ],
  products:JSON.parse(localStorage.ks_products||JSON.stringify(DEFAULT_PRODUCTS)),
  po:JSON.parse(localStorage.ks_po||JSON.stringify({status:'open',label:'PRE-ORDER',open_time:'07:00',close_time:'12:00'}))
};

let rawCart = JSON.parse(localStorage.ks_cart||'{}');
let cart = {};
Object.entries(rawCart).forEach(([k,v]) => {
  if (typeof v === 'number') {
    cart[k] = { qty: v, note: '' };
  } else {
    cart[k] = v;
  }
});

let cat=0,q='',view='home',S={name:localStorage.ks_name||'',kelas:localStorage.ks_kelas||'',code:localStorage.ks_code||'',pay:'Tunai',note:''},Q=null;

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
const pic=p=>p.image.startsWith('http')||p.image.startsWith('data:')?`<img src="${p.image}" alt="">`:p.image;
const items=()=>Object.entries(cart).map(([id,obj])=>({id:+id,qty:obj.qty,note:obj.note||''}));
const count=()=>Object.values(cart).reduce((a,b)=>a+b.qty,0);
function save(){localStorage.ks_cart=JSON.stringify(cart);$('#cc').textContent=count()||'';$('#cc').style.display=count()?'':'none'}
function poBar(){const p=M.po;return `<div class="po ${p.status}" id="po"><span>PRE-ORDER</span></div>`}
function card(p){const off=!p.active||p.stock<1||M.po.status=='closed';return `<div class="card"><div class="pic">${pic(p)}</div><div class="info"><b>${esc(p.name)}</b><small>${esc(p.description)}</small><small>${esc(p.cat)} · Sisa ${p.stock} porsi</small><span class="price">${rp(p.price)}</span><button class="add" ${off?'disabled':''} onclick="add(${p.id})">${!p.active||p.stock<1?'Habis':M.po.status=='closed'?'PO ditutup':'+ Keranjang'}</button></div></div>`}

function add(id){
  const p=M.products.find(x=>x.id==id);
  let curQty = cart[id] ? cart[id].qty : 0;
  if(p&&curQty>=p.stock)return toast('Stok tinggal '+p.stock+' porsi');
  if(!cart[id]) cart[id]={qty:0, note:''};
  cart[id].qty += 1;
  save();
  toast('Masuk keranjang');
}

function chg(id,d){
  const p=M.products.find(x=>x.id==id);
  let curQty = cart[id] ? cart[id].qty : 0;
  if(d>0&&p&&curQty>=p.stock)return toast('Stok tinggal '+p.stock+' porsi');
  if(!cart[id]) cart[id]={qty:0, note:''};
  cart[id].qty += d;
  if(cart[id].qty<=0) delete cart[id];
  save();
  quote();
}

function updateItemNote(id, val){
  if(cart[id]){
    cart[id].note = val;
    save();
  }
}

function del(id){delete cart[id];save();quote()}

async function quote(){
  if(!count()){Q=null;return go('cart')}
  let subtotal=Object.entries(cart).reduce((a,[id,obj])=>a+(M.products.find(p=>p.id==+id)?.price||0)*obj.qty,0);
  let discount=0;
  let error='';
  let code=S.code.trim().toUpperCase();

  if(code==='SMANSAGEMBIRA'){
    if(subtotal>=50000 && subtotal<=99999){
      discount=subtotal*0.10;
    } else {
      error='Voucher SMANSAGEMBIRA hanya berlaku untuk total belanja Rp50.000 - Rp99.999';
    }
  } else if(code==='BESMARTWUS'){
    if(subtotal>=100000){
      discount=subtotal*0.15;
    } else {
      error='Voucher BESMARTWUS hanya berlaku untuk total belanja minimal Rp100.000';
    }
  } else if(code!==''){
    error='Kode voucher tidak valid';
  } else {
    if(subtotal>=100000){
      discount=subtotal*0.15;
    } else if(subtotal>=50000 && subtotal<=99999){
      discount=subtotal*0.10;
    }
  }

  Q={subtotal, discount, total: Math.max(0, subtotal - discount), error};
  if(view=='cart')go('cart');
}

function go(v){
  view=v;['home','cart','orders'].forEach(x=>$('#n-'+x).classList.toggle('on',x==v));$('.search').style.display=v=='home'?'':'none';
  M.products=JSON.parse(localStorage.ks_products||JSON.stringify(DEFAULT_PRODUCTS));
  M.po=JSON.parse(localStorage.ks_po||JSON.stringify(M.po));
  
  const a=$('#app');
  if(v=='home'){const t=q.toLowerCase(),f=M.products.filter(p=>(!cat||p.category_id==cat)&&(p.name+p.description).toLowerCase().includes(t));
   a.innerHTML=poBar()+(q||cat?'':bnr())+`<div class="chips"><button class="chip ${!cat?'on':''}" onclick="cat=0;go('home')">Semua</button>${M.categories.map(c=>`<button class="chip ${cat==c.id?'on':''}" onclick="cat=${c.id};go('home')">${esc(c.name)}</button>`).join('')}</div>`+`<h2>${q||cat?'Hasil':'Menu Favorit Hari Ini'}</h2>`+(f.length?`<div class="grid">${f.map(card).join('')}</div>`:'<div class="empty">Menu tidak ditemukan.</div>')}
  
  if(v=='cart'){if(!count()){a.innerHTML='<div class="empty">Keranjang kosong.<br>Pilih menu dulu di Beranda.</div>';return}
   quote();
   const ps=Object.fromEntries(M.products.map(p=>[p.id,p]));
   
   const grouped = {};
   Object.entries(cart).forEach(([id, obj]) => {
     const p = ps[id];
     if(p){
       const cName = p.cat || 'Lainnya';
       if(!grouped[cName]) grouped[cName] = [];
       grouped[cName].push({id, obj, p});
     }
   });

   let cartHtml = '';
   for(const [catName, itemsArr] of Object.entries(grouped)){
     cartHtml += `<div class="box" style="margin-bottom:12px;background:var(--w);padding:12px;border-radius:14px;">
       <h3 style="margin:0 0 8px;font-size:15px;color:var(--g);border-bottom:1px solid #8883;padding-bottom:6px;">📦 Kategori: ${esc(catName)}</h3>
       ${itemsArr.map(({id, obj, p})=>`
         <div class="row" style="background:var(--bg);border-radius:10px;padding:8px;margin-bottom:8px;">
           <div class="pic" style="width:48px;height:48px;border-radius:8px;font-size:24px">${pic(p)}</div>
           <div class="grow"><b>${esc(p.name)}</b><br><span class="price">${rp(p.price*obj.qty)}</span></div>
           <div class="qty"><button onclick="chg(${id},-1)">−</button><b>${obj.qty}</b><button onclick="chg(${id},1)">+</button></div>
           <button class="qty" style="border:0;background:none;cursor:pointer" onclick="del(${id})" aria-label="Hapus">🗑️</button>
         </div>
         <div style="margin-bottom:8px;">
           <input placeholder="Catatan khusus menu ini (cth: Jangan pakai pedas)..." value="${esc(obj.note||'')}" oninput="updateItemNote(${id}, this.value)" style="margin:0;padding:8px;font-size:13px;">
         </div>
       `).join('')}
     </div>`;
   }

   a.innerHTML=poBar()+'<h2>Keranjang Belanja</h2>'+cartHtml+
   `<div class="box"><b>Identitas siswa</b><input id="nm" placeholder="Nama lengkap" value="${esc(S.name)}" oninput="S.name=this.value"><select id="kl" onchange="S.kelas=this.value"><option value="">Pilih kelas</option>${KELAS.map(k=>`<option ${S.kelas==k?'selected':''}>${k}</option>`).join('')}</select></div>
   <div class="box"><b>Voucher</b><div style="display:flex;gap:8px"><input id="vc" placeholder="Kode voucher (cth: SMANSAGEMBIRA)" value="${esc(S.code)}" oninput="S.code=this.value.toUpperCase();localStorage.ks_code=S.code;"><button class="add" style="padding:0 16px;height:44px;margin-top:4px" onclick="quote()">Terapkan</button></div></div>

       <div style="margin-left:24px;font-size:13px;color:var(--m);font-weight:600;">NO REK: BRI - 434801010205503</div>

async function order(){
  if(!S.name || !S.kelas){alert('Mohon isi Nama dan Kelas terlebih dahulu.');return;}
  
  const payload = {
    name: S.name,
    kelas: S.kelas,
    payment: S.pay,
    note: S.note,
    voucher: S.code,
    items: items()
  };

  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    
    if(result.success){
      const myCodes = JSON.parse(localStorage.ks_my_codes || '[]');
      myCodes.unshift(result.code);
      localStorage.ks_my_codes = JSON.stringify(myCodes);

      cart={}; save(); S.code=''; localStorage.removeItem('ks_code'); Q=null;
      toast('Pesanan '+result.code+' berhasil dibuat');
      go('orders');
    } else {
      alert('Gagal membuat pesanan');
    }
  } catch(err) {
    alert('Terjadi kesalahan koneksi ke server.');
  }
}

async function cancelOrder(code){
  const reason = prompt('Masukkan alasan pembatalan pesanan:');
  if(reason === null) return; 
  if(!reason.trim()){alert('Alasan pembatalan wajib diisi.');return;}

  try {
    const res = await fetch('/api/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, reason: reason.trim() })
    });
    const result = await res.json();
    if(result.success){
      toast('Pesanan berhasil dibatalkan');
      loadOrders();
    } else {
      alert(result.error || 'Gagal membatalkan pesanan');
    }
  } catch(e) {
    alert('Terjadi kesalahan koneksi.');
  }
}

async function loadOrders(){
  const myCodes = JSON.parse(localStorage.ks_my_codes || '[]');
  if(!myCodes.length){$('#app').innerHTML='<div class="empty">Belum ada pesanan.</div>';return}
  
  try {
    const res = await fetch('/api/orders?codes=' + myCodes.join(','));
    const orders = await res.json();
    if(!orders.length){$('#app').innerHTML='<div class="empty">Belum ada pesanan.</div>';return}
    
    $('#app').innerHTML='<h2>Riwayat pesanan</h2>'+orders.map(o=>`
      <div class="box sum">
        <div><b>${o.code}</b><span class="badge" style="background:${o.status=='Dikonfirmasi'?'#d9f5e5':o.status=='Dibatalkan'?'#fbdcdc':'#ffc83d'};color:#000">${o.status}</span></div>
        <small style="color:var(--m)">${o.created.replace('T',' ').slice(0,16)} · ${esc(o.name)} (${o.kelas})</small>
        ${o.items.map(i=>`<div><span>${i.qty}× ${esc(i.name)} ${i.note?`<i>(${esc(i.note)})</i>`:''}</span><span>${rp(i.price*i.qty)}</span></div>`).join('')}
        ${o.discount>0?`<div><span>Diskon Voucher</span><span style="color:var(--g)">-${rp(o.discount)}</span></div>`:''}
        <div class="tot"><span>Total · ${o.payment.method}</span><span>${rp(o.total)}</span></div>
        <small style="color:var(--m)">Status Pembayaran: ${o.payment.status}</small>
        ${o.cancel_reason?`<div style="margin-top:6px;color:var(--r);font-size:13px;"><b>Alasan Dibatalkan:</b> ${esc(o.cancel_reason)}</div>`:''}
        ${o.status=='Menunggu konfirmasi'?`<div style="margin-top:10px;"><button class="r" style="width:100%;padding:8px;" onclick="cancelOrder('${o.code}')">Batalkan Pesanan</button></div>`:''}
      </div>`).join('');
  } catch(e) {
    $('#app').innerHTML='<div class="empty">Gagal memuat pesanan dari server.</div>';
  }
}

setInterval(()=>{bi=(bi+1)%PR.length;const e=$('#bn');if(e)e.outerHTML=bnr()},5000);save();go('home');
